<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#C9A84C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WC 2026">
<link rel="manifest" href="manifest.json">
<title>World Cup 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{
  --gold:#C9A84C;--gold2:#E8C96A;--gold3:rgba(201,168,76,0.1);
  --dark:#06060E;--d2:#0C0C18;--d3:#131320;--d4:#1A1A2A;--d5:#232335;--d6:#2C2C40;
  --text:#F2F0EA;--muted:#6A6A80;--live:#E63946;--green:#2DC653;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}

/* HEADER */
.header{background:var(--dark);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--d4);}
.header-inner{max-width:1100px;margin:0 auto;padding:12px 18px 10px;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-badge{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--d4),var(--d5));border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 16px rgba(201,168,76,0.2);}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:2.5px;color:var(--gold);line-height:1;}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;display:block;margin-top:1px;}
.header-right{display:flex;align-items:center;gap:7px;}
.pill{background:var(--d3);border:1px solid var(--d5);border-radius:20px;padding:5px 11px;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;transition:all 0.15s;}
.pill.on{border-color:var(--gold);color:var(--gold);background:var(--gold3);}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;background:none;border:1px solid var(--d5);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
.tab.active{background:var(--gold);border-color:var(--gold);color:var(--dark);font-weight:800;}

/* BANNERS */
.banner{display:none;padding:9px 18px;align-items:center;gap:10px;border-bottom:1px solid;max-width:100%;}
.banner.show{display:flex;}
.bi{background:#0C1525;border-color:#1E4A80;}
.bn{background:#0A1510;border-color:#1A4020;}
.bt{flex:1;font-size:12px;line-height:1.4;}
.bt b{color:var(--gold2);}
.bn .bt b{color:var(--green);}
.bb{border:none;border-radius:8px;padding:6px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
.bi .bb{background:#1E4A80;color:#fff;}
.bn .bb{background:#1A4020;color:#fff;}
.bc{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:10px 18px 90px;}
@media(min-width:768px){
  .main.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:start;}
  .main.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
}

/* DATE */
.date-hd{display:flex;align-items:center;gap:8px;padding:16px 0 8px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.date-hd::after{content:'';flex:1;height:1px;background:var(--d4);}
.today-b{background:linear-gradient(135deg,#A07830,var(--gold));color:var(--dark);border-radius:4px;padding:1px 7px;font-size:9px;font-weight:800;letter-spacing:1px;}

/* CARD */
.card{background:var(--d2);border:1px solid var(--d4);border-radius:14px;padding:12px 13px;margin-bottom:8px;position:relative;cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s,transform 0.1s;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.25),transparent);}
.card:hover{border-color:var(--d6);box-shadow:0 4px 20px rgba(0,0,0,0.4);}
.card:active{transform:scale(0.99);}
.card.live{border-color:var(--live);background:#0E0508;}
.card.live::before{background:linear-gradient(90deg,transparent,rgba(230,57,70,0.4),transparent);}
.card.done{opacity:0.6;}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.card-left{display:flex;align-items:center;gap:5px;flex:1;min-width:0;}
.gbadge{background:var(--d4);border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted);white-space:nowrap;text-transform:uppercase;flex-shrink:0;}
.gbadge.ko{color:var(--gold);border:1px solid rgba(201,168,76,0.2);}
.venue{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.ctime{font-size:11px;font-weight:700;color:var(--gold2);white-space:nowrap;}
.live-tag{background:var(--live);color:#fff;font-size:9px;font-weight:800;letter-spacing:1px;border-radius:5px;padding:2px 7px;animation:blink 1.4s infinite;white-space:nowrap;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.bell{position:absolute;top:9px;right:10px;background:var(--d4);border:1px solid var(--d5);border-radius:8px;width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all 0.15s;z-index:2;}
.bell.on{background:var(--gold3);border-color:var(--gold);}
.teams{display:flex;align-items:center;gap:8px;padding-right:34px;}
.team{flex:1;display:flex;align-items:center;gap:7px;min-width:0;}
.team.r{flex-direction:row-reverse;}
.flag{font-size:22px;flex-shrink:0;line-height:1;}
.tname{font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team.r .tname{text-align:right;}
.mid{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:46px;}
.vs{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--muted);letter-spacing:1px;}
.sb{display:flex;align-items:center;gap:2px;}
.sn{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);line-height:1;min-width:16px;text-align:center;}
.sd{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted);}
.lmin{font-size:9px;color:var(--live);font-weight:700;margin-top:1px;}

/* MODAL */
#modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.88);backdrop-filter:blur(8px);overflow-y:auto;}
#modal.open{display:block;}
.mi{max-width:720px;margin:0 auto;padding:16px 14px 40px;}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.mt{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold);}
.mc{background:var(--d4);border:1px solid var(--d5);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--text);transition:background 0.15s;}
.mc:hover{background:var(--d5);}

/* SCORE BAR */
.msb{background:var(--d3);border:1px solid var(--d5);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.msbt{flex:1;display:flex;align-items:center;gap:8px;}
.msbt.r{flex-direction:row-reverse;}
.msbf{font-size:30px;}
.msbn{font-size:14px;font-weight:700;}
.msbsc{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--text);min-width:90px;text-align:center;letter-spacing:4px;}
.msbvs{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--muted);letter-spacing:2px;}

/* PITCH */
.pw{background:var(--d3);border:1px solid var(--d5);border-radius:14px;overflow:hidden;margin-bottom:12px;}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--d5);}
.ptl{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;}
.pf{font-size:11px;color:var(--muted);}
.pitch{background:linear-gradient(180deg,#1E4D1E 0%,#1A421A 50%,#1E4D1E 100%);position:relative;aspect-ratio:0.65;width:100%;}
/* pitch lines */
.pitch::after{content:'';position:absolute;inset:6% 8%;border:1.5px solid rgba(255,255,255,0.12);pointer-events:none;}
.pl-half{position:absolute;top:50%;left:8%;right:8%;height:1px;background:rgba(255,255,255,0.12);}
.pl-circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,0.12);}
.pl-boxt{position:absolute;top:6%;left:25%;right:25%;height:16%;border:1.5px solid rgba(255,255,255,0.12);border-top:none;}
.pl-boxb{position:absolute;bottom:6%;left:25%;right:25%;height:16%;border:1.5px solid rgba(255,255,255,0.12);border-bottom:none;}
.pdot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;}
.pav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1A2A3A,#243040);border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.5);overflow:hidden;}
.pav.gk{border-color:#F0B429;}
.pav img{width:100%;height:100%;object-fit:cover;}
.plb{background:rgba(0,0,0,0.75);border-radius:4px;padding:1px 4px;font-size:8px;font-weight:600;color:#fff;white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis;text-align:center;}

/* SUBS */
.sw{background:var(--d3);border:1px solid var(--d5);border-radius:14px;padding:12px 14px;margin-bottom:12px;}
.stl{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.sr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--d4);}
.sr:last-child{border-bottom:none;}
.snum{width:22px;font-size:10px;color:var(--muted);font-weight:700;text-align:right;flex-shrink:0;}
.sname{flex:1;font-size:12px;font-weight:500;}
.spos{font-size:9px;color:var(--muted);background:var(--d4);border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:1px;}

/* LOADING */
.loading{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;line-height:1.8;}
.spin{width:28px;height:28px;border:2px solid var(--d5);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* GROUPS */
.gcard{background:var(--d2);border:1px solid var(--d4);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.gtitle{background:var(--d3);padding:9px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--gold);border-bottom:1px solid var(--d4);}
.gteam{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--d4);font-size:13px;font-weight:500;}
.gteam:last-child{border-bottom:none;}
.grank{width:16px;font-size:10px;color:var(--muted);font-weight:700;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;line-height:1.8;}
.empty-i{font-size:44px;margin-bottom:12px;}

#toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--d3);border:1px solid var(--d5);border-radius:22px;padding:8px 18px;font-size:12px;font-weight:500;color:var(--text);opacity:0;transition:all 0.25s;z-index:600;white-space:nowrap;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,12,24,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--d4);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0);}
.nbtn{flex:1;background:none;border:none;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);transition:color 0.15s;font-family:'Inter',sans-serif;}
.nbtn.active{color:var(--gold);}
.ni{font-size:20px;line-height:1;}
.nl{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
@media(min-width:768px){
  .nav{position:sticky;top:0;z-index:300;order:-1;border-top:none;border-bottom:1px solid var(--d4);justify-content:center;}
  .nbtn{padding:12px 24px;flex-direction:row;gap:7px;flex:0;}
  .nl{font-size:12px;letter-spacing:0;}
  .ni{font-size:16px;}
}
</style>
</head>

</div>

<div class="main" id="main"></div>

</nav>

// ===== FETCH SCORES (football-data.org) =====
async function fetchScores(){
  try {
    const r = await fetch(`${FD_BASE}/competitions/WC/matches`, {
      headers:{'X-Auth-Token': FD_KEY}
    });
    if(!r.ok){ console.log('Scores API error:', r.status); return; }
    const data = await r.json();
    if(!data.matches) return;
    let changed=false;
    data.matches.forEach(m=>{
      const hn = NM[m.homeTeam.name]||m.homeTeam.name;
      const an = NM[m.awayTeam.name]||m.awayTeam.name;
      const key = `${hn}|${an}`;
      FD_IDS[key] = m.id;
      const st = m.status;
      if(!['IN_PLAY','PAUSED','FINISHED'].includes(st)) return;
      const ft=m.score.fullTime, ht=m.score.halfTime;
      const gh = ft.home!==null ? ft.home : (ht.home!==null ? ht.home : null);
      const ga = ft.away!==null ? ft.away : (ht.away!==null ? ht.away : null);
      if(gh!==null && ga!==null){
        const sc=`${gh}-${ga}`;
        if(SC[key]!==sc){ SC[key]=sc; changed=true; }
      }
      LM[key] = (st==='IN_PLAY'||st==='PAUSED') ? (m.minute?`${m.minute}'`:'🔴') : null;
    });
    if(changed) render();
    console.log('Scores fetched OK, matches:', data.matches.length);
  } catch(e){ console.log('Score fetch error:', e.message); }
}

// ===== LINEUP (api-sports.io) =====
async function fetchLineup(m){
  const area = document.getElementById('lineup-area');
  try {
    // Step 1: find fixture ID by date
    const date = new Date(m.u).toISOString().split('T')[0];
    const r1 = await fetch(`${AS_BASE}/fixtures?league=1&season=2026&date=${date}`,{
      headers:{'x-apisports-key': AS_KEY}
    });
    if(!r1.ok) throw new Error('Fixtures fetch failed: '+r1.status);
    const d1 = await r1.json();
    if(d1.errors && Object.keys(d1.errors).length>0){
      throw new Error(JSON.stringify(d1.errors));
    }
    const fixtures = d1.response||[];
    const fix = fixtures.find(f=>{
      const hn=NM[f.teams.home.name]||f.teams.home.name;
      const an=NM[f.teams.away.name]||f.teams.away.name;
      return hn===m.h && an===m.a;
    });
    if(!fix){ area.innerHTML=noLineup(); return; }

    // Step 2: get lineups
    const r2 = await fetch(`${AS_BASE}/fixtures/lineups?fixture=${fix.fixture.id}`,{
      headers:{'x-apisports-key': AS_KEY}
    });
    if(!r2.ok) throw new Error('Lineups fetch failed: '+r2.status);
    const d2 = await r2.json();
    const lineups = d2.response||[];
    if(lineups.length<2){ area.innerHTML=noLineup(); return; }
    area.innerHTML = buildLineupHTML(lineups, m);
  } catch(e){
    console.log('Lineup error:', e.message);
    area.innerHTML=noLineup(e.message);
  }
}

function noLineup(err=''){
  return `<div class="loading">⚽ Lineups not available yet.<br>
    <span style="font-size:11px;color:var(--muted)">Published ~1hr before kick-off${err?' · '+err:''}</span></div>`;
}

function buildLineupHTML(lineups, m){
  const hL=lineups[0], aL=lineups[1];
  const hN=NM[hL.team.name]||m.h;
  const aN=NM[aL.team.name]||m.a;
  return pitchHTML(hL,hN,'home') + pitchHTML(aL,aN,'away') + subsHTML(hL,hN) + subsHTML(aL,aN);
}

function pitchHTML(lu, name, side){
  const formation = lu.formation||'4-4-2';
  const players = lu.startXI||[];
  const rows = formation.split('-').map(Number);
  // Build rows: first player is GK, then rows from back to front
  const rowGroups = [ [players[0]] ];
  let i=1;
  rows.forEach(n=>{ rowGroups.push(players.slice(i,i+n)); i+=n; });

  const isHome = side==='home';
  const total = rowGroups.length;
  let dots='';

  rowGroups.forEach((row, ri)=>{
    // Home: GK at bottom (88%), attackers near top (15%)
    // Away: GK at top (12%), attackers near bottom (85%)
    const yPct = isHome
      ? 88 - (ri * 73/(total-1))
      : 12 + (ri * 73/(total-1));

    row.forEach((p, pi)=>{
      if(!p||!p.player) return;
      const pl=p.player;
      const name=pl.name||'';
      const last=name.split(' ').pop();
      const num=pl.number||'';
      const isGK=ri===0;
      const xPct = row.length===1 ? 50 : 10+(pi*(80/(row.length-1)));
      const photo=pl.photo||'';
      dots+=`<div class="pdot" style="left:${xPct}%;top:${yPct}%;">
        <div class="pav ${isGK?'gk':''}">
          ${photo?`<img src="${photo}" loading="lazy" onerror="this.style.display='none';this.parentNode.textContent='${num}'">`:`${num}`}
        </div>
        <div class="plb">${last}</div>
      </div>`;
    });
  });

  return `<div class="pw">
    <div class="ph">
      <div class="ptl">${F[name]||''} ${name}</div>
      <div class="pf">${formation}</div>
    </div>
    <div class="pitch">
      <div class="pl-half"></div>
      <div class="pl-circle"></div>
      <div class="pl-boxt"></div>
      <div class="pl-boxb"></div>
      ${dots}
    </div>
  </div>`;
}

function subsHTML(lu, name){
  const subs=lu.bench||[];
  if(!subs.length) return '';
  const rows=subs.map(p=>{
    if(!p||!p.player) return '';
    const pl=p.player;
    const pos=({'G':'GK','D':'DEF','M':'MID','F':'FWD'}[pl.pos])||pl.pos||'SUB';
    return `<div class="sr">
      <span class="snum">${pl.number||'-'}</span>
      <span class="sname">${pl.name||''}</span>
      <span class="spos">${pos}</span>
    </div>`;
  }).join('');
  return `<div class="sw">
    <div class="stl">${F[name]||''} ${name} — Bench</div>
    ${rows}
  </div>`;
}

// ===== MODAL =====
async function openModal(id){
  const m=M.find(x=>x.id===id);
  if(!m) return;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';

  const score=SC[`${m.h}|${m.a}`]||null;
  const live=isLive(m.u), done=isDone(m.u);
  const lmin=LM[`${m.h}|${m.a}`]||'';

  const statusTag = live
    ? `<span class="live-tag">LIVE ${lmin}</span>`
    : done ? `<span style="font-size:11px;color:var(--muted)">FT</span>`
    : `<span class="ctime">${fmtTime(m.u)}</span>`;

  const scoreDisp = score ? score.replace('-',' — ') : (done?'—':'vs');

  document.getElementById('modal-body').innerHTML=`
    <div class="msb">
      <div class="msbt">
        <span class="msbf">${F[m.h]||'🏳️'}</span>
        <span class="msbn">${m.h}</span>
      </div>
      <div style="text-align:center;flex-shrink:0;">
        <div class="msbsc">${scoreDisp}</div>
        <div style="margin-top:4px;">${statusTag}</div>
        <div style="font-size:9px;color:var(--muted);margin-top:3px;">📍 ${m.v}</div>
      </div>
      <div class="msbt r">
        <span class="msbf">${F[m.a]||'🏳️'}</span>
        <span class="msbn">${m.a}</span>
      </div>
    </div>
    <div id="lineup-area">
      <div class="loading"><div class="spin"></div>Loading lineups...</div>
    </div>`;

  await fetchLineup(m);
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}

    document.getElementById('bell-p').classList.add('on');

  if(!notifOn){enableNotifs();return;}
  const now=new Date(); let count=0;

    if(at>now && !notifMap[m.id]){ notifMap[m.id]=true; count++; }
  });
  saveN(); reschedule(); toast(`🔔 ${count} reminders set!`); render();
}

  e.stopPropagation();
  if(!notifOn){enableNotifs();return;}
  notifMap[id]=!notifMap[id]; saveN();
  if(notifMap[id]){scheduleOne(M.find(m=>m.id===id));toast('🔔 Set!');}
  else{clearTimer(id);toast('🔕 Removed');}
  render();
}
function saveN(){localStorage.setItem('wc_n',JSON.stringify(notifMap));}
function scheduleOne(m){
  if(!m) return;
  const at=new Date(new Date(m.u)-30*60000), delay=at-new Date();
  if(delay<=0) return; clearTimer(m.id);
  timers[m.id]=setTimeout(()=>{
    if(!notifMap[m.id]) return;
    const title='⚽ Kick-off in 30 minutes!';
    const body=`${F[m.h]||''} ${m.h} vs ${m.a} ${F[m.a]||''}\n📍 ${m.v}`;
    const opts={body,icon:'./icons/icon-192.png',tag:`wc-${m.id}`,renotify:false,vibrate:[200,100,200]};
    if(swReg) swReg.showNotification(title,opts);
    else if(Notification.permission==='granted') new Notification(title,opts);
    notifMap[m.id]='fired'; saveN();
  },delay);
}
function clearTimer(id){if(timers[id]){clearTimeout(timers[id]);delete timers[id];}}
function reschedule(){M.forEach(m=>{if(notifMap[m.id]===true) scheduleOne(m);});}

// ===== HELPERS =====
function gl(g){const m={'R32':'R32','R16':'R16','QF':'Quarter','SF':'Semi','Final':'Final','3rd':'3rd Place'};return m[g]||'Group '+g;}
function isToday(u){const d=new Date(u),n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function isLive(u){const d=(new Date()-new Date(u))/60000;return d>=0&&d<105;}
function isDone(u){return(new Date()-new Date(u))/60000>105;}
function fmtTime(u){return new Date(u).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ===== NAV =====
function setStage(s){
  stage=s;
  document.querySelectorAll('#stage-tabs .tab').forEach((t,i)=>
    t.classList.toggle('active',['group','r32','r16','qf','sf','final'][i]===s));
  render();
}
function sw(v){
  view=v;
  ['s','t','g'].forEach((x,i)=>document.getElementById('nb'+['s','t','g'][i]).classList.remove('active'));
  document.getElementById('nb'+v[0]).classList.add('active');
  document.getElementById('stage-tabs').style.display=v==='schedule'?'flex':'none';
  render();
}

// ===== RENDER =====
function card(m){
  const live=isLive(m.u), done=isDone(m.u);
  const ko=['r32','r16','qf','sf','final'].includes(m.s);
  const key=`${m.h}|${m.a}`;
  const score=SC[key]||null, lmin=LM[key]||'';
  const hasN=notifMap[m.id]===true;
  const canN=notifOn&&!done&&!live;
  const timeBadge=live?`<span class="live-tag">LIVE ${lmin}</span>`:`<span class="ctime">${fmtTime(m.u)}</span>`;
  const mid=score
    ?`<div class="sb"><span class="sn">${score.split('-')[0]}</span><span class="sd">-</span><span class="sn">${score.split('-')[1]}</span></div>${live&&lmin?`<span class="lmin">${lmin}</span>`:''}`
    :`<span class="vs">VS</span>`;
  const bell=canN?`<div class="bell ${hasN?'on':''}" onclick="toggleNotif(event,${m.id})">${hasN?'🔔':'🔕'}</div>`:'';
  return `<div class="card ${live?'live':''} ${done&&!live&&!score?'done':''}" onclick="openModal(${m.id})">
    ${bell}
    <div class="card-top">
      <div class="card-left"><span class="gbadge ${ko?'ko':''}">${gl(m.g)}</span><span class="venue">📍 ${m.v}</span></div>
      ${timeBadge}
    </div>
    <div class="teams">
      <div class="team"><span class="flag">${F[m.h]||'🏳️'}</span><span class="tname">${m.h}</span></div>
      <div class="mid">${mid}</div>
      <div class="team r"><span class="tname">${m.a}</span><span class="flag">${F[m.a]||'🏳️'}</span></div>
    </div>
  </div>`;
}

function render(){
  const main=document.getElementById('main');
  if(view==='groups'){
    main.className='main grid3';
    main.innerHTML=Object.entries(GROUPS).map(([g,teams])=>
      `<div class="gcard"><div class="gtitle">⚽ GROUP ${g}</div>
      ${teams.map((t,i)=>`<div class="gteam"><span class="grank">${i+1}</span><span>${F[t]||'🏳️'}</span><span>${t}</span></div>`).join('')}
      </div>`).join('');
    return;
  }
  if(view==='today'){
    main.className='main';
    const today=M.filter(m=>isToday(m.u));
    main.innerHTML=today.length?today.map(card).join('')
      :`<div class="empty"><div class="empty-i">⚽</div>No matches today.</div>`;
    return;
  }
  main.className='main grid';
  const list=M.filter(m=>m.s===stage);
  const byDate={};
  list.forEach(m=>{
    const k=new Date(m.u).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    if(!byDate[k]) byDate[k]={u:m.u,items:[]};
    byDate[k].items.push(m);
  });
  main.innerHTML=Object.entries(byDate).map(([date,data])=>
    `<div><div class="date-hd">${isToday(data.u)?'<span class="today-b">TODAY</span>':''}${date}</div>
    ${data.items.map(card).join('')}</div>`).join('')
    ||`<div class="empty"><div class="empty-i">🏟️</div>Matchups TBD after group stage</div>`;
}
</script>
</body>
