:root {
  --gold:#D4AF37;--gold2:#FFE8A3;--dark:#05060C;--d2:#0E1018;--d3:#151826;
  --d4:#1E2233;--d5:#2C3147;--text:#F5F4F0;--muted:#7E8398;--live:#FF3B5C;--green:#2DE890;
  --teal:#19E0C9;--violet:#8B5CF6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:-webkit-fill-available;}
body{
  background:

    radial-gradient(800px 600px at 110% 12%, rgba(139,92,246,0.14), transparent 55%),
    radial-gradient(700px 500px at 50% 100%, rgba(25,224,201,0.08), transparent 60%),
    var(--dark);
  color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;
  background-attachment:fixed;
}
.banner{display:none;padding:10px 14px;align-items:center;gap:10px;border-bottom:1px solid;max-width:480px;margin:0 auto;width:100%;backdrop-filter:blur(10px);}
.banner.show{display:flex;}
.banner-install{background:rgba(25,224,201,0.07);border-color:rgba(25,224,201,0.35);}
.banner-notif{background:rgba(45,232,144,0.07);border-color:rgba(45,232,144,0.35);}
.banner-text{flex:1;font-size:12px;line-height:1.4;}
.banner-text b{font-size:12px;}
.banner-install .banner-text b{color:var(--teal);}
.banner-notif .banner-text b{color:var(--green);}
.banner-btn{border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
.banner-install .banner-btn{background:var(--teal);color:#04231F;}
.banner-notif .banner-btn{background:var(--green);color:#04231A;}
.banner-close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;}
.header{background:rgba(8,9,16,0.78);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(212,175,55,0.18);box-shadow:0 8px 30px rgba(0,0,0,0.35);}
.header-inner{max-width:480px;margin:0 auto;padding:12px 16px 10px;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.brand{display:flex;align-items:center;gap:10px;}

.brand-name{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:3px;line-height:1;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#A8842F);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;display:block;margin-top:2px;}
.header-actions{display:flex;align-items:center;gap:6px;}
.pill{background:rgba(255,255,255,0.03);border:1px solid var(--d4);border-radius:20px;padding:5px 10px;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;font-weight:500;}
.pill.gold{border-color:var(--gold);color:var(--gold2);background:rgba(212,175,55,0.12);box-shadow:0 0 14px rgba(212,175,55,0.25);}
.pill-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);}
.pill-live{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.4s infinite;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;background:rgba(255,255,255,0.02);border:1px solid var(--d5);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;}
.tab.active{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:var(--gold);color:#15110A;font-weight:800;box-shadow:0 0 16px rgba(212,175,55,0.45);}
.main{max-width:480px;margin:0 auto;padding:8px 14px 86px;}
.date-hd{display:flex;align-items:center;gap:8px;padding:18px 0 8px;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);}
.date-hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--d4),transparent);}
.today-badge{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#15110A;border-radius:5px;padding:2px 7px;font-size:9px;font-weight:900;letter-spacing:1px;box-shadow:0 0 10px rgba(212,175,55,0.4);}

.card:active{transform:scale(0.99);}
.card.live{border-color:var(--live);background:linear-gradient(160deg,rgba(255,59,92,0.1),rgba(255,255,255,0.01)),var(--d2);box-shadow:0 0 22px rgba(255,59,92,0.25);}
.card.done{opacity:0.55;}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
.gbadge{background:rgba(255,255,255,0.04);border:1px solid var(--d5);border-radius:6px;padding:2px 8px;font-size:9px;font-weight:800;letter-spacing:1.5px;color:var(--muted);white-space:nowrap;text-transform:uppercase;}
.gbadge.ko{color:var(--gold2);border:1px solid rgba(212,175,55,0.35);background:rgba(212,175,55,0.08);}
.venue{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;}
.card-time{font-size:11px;font-weight:800;color:var(--teal);white-space:nowrap;}
.live-tag{background:linear-gradient(135deg,#FF5577,var(--live));color:white;font-size:9px;font-weight:900;letter-spacing:1.5px;border-radius:5px;padding:3px 8px;animation:blink 1.4s infinite;box-shadow:0 0 12px rgba(255,59,92,0.5);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.55}}
.bell{position:absolute;top:10px;right:11px;background:rgba(255,255,255,0.03);border:1px solid var(--d5);border-radius:9px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all 0.15s;}
.bell.on{background:rgba(212,175,55,0.15);border-color:var(--gold);box-shadow:0 0 10px rgba(212,175,55,0.3);}
.bell:active{transform:scale(0.92);}
.teams{display:flex;align-items:center;gap:6px;padding-right:36px;}
.team{flex:1;display:flex;align-items:center;gap:8px;min-width:0;}
.team.r{flex-direction:row-reverse;}
.flag{font-size:21px;flex-shrink:0;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));}
.tname{font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team.r .tname{text-align:right;}
.mid{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:48px;}
.vs{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);letter-spacing:2px;}
.score{display:flex;align-items:center;gap:4px;}

.live-min{font-size:9px;color:var(--live);font-weight:800;margin-top:3px;letter-spacing:0.5px;}

.gteam:last-child{border-bottom:none;}
.grank{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--gold2);font-weight:800;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;line-height:1.6;}
.empty-ico{font-size:44px;margin-bottom:12px;filter:drop-shadow(0 4px 12px rgba(212,175,55,0.3));}

.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,9,16,0.78);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-top:1px solid rgba(212,175,55,0.18);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -8px 30px rgba(0,0,0,0.35);}
.nbtn{flex:1;background:none;border:none;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);transition:color 0.15s;font-family:'Inter',sans-serif;}
.nbtn.active{color:var(--gold2);text-shadow:0 0 14px rgba(212,175,55,0.5);}
.nicon{font-size:20px;line-height:1;}
.nlabel{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
@keyframes scoreFlash{0%{background:rgba(212,175,55,0.3)}100%{background:transparent}}
.score-flash{animation:scoreFlash 1.5s ease-out;}

// ======= STATE =======
let stage='group', view='schedule', notifOn=false;
let notifMap=JSON.parse(localStorage.getItem('wc_n')||'{}');
let timers={}, swReg=null, deferredPrompt=null;
let lastFetch=0, fetchInterval=null;

// ======= BOOT =======
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('tz-text').textContent =
    new Date().toLocaleDateString('en-US',{timeZoneName:'short'}).split(', ')[1]||'Local';

  if('serviceWorker' in navigator)
    navigator.serviceWorker.register('./sw.js').then(r=>{swReg=r;}).catch(()=>{});

  if('Notification' in window && Notification.permission==='granted'){
    notifOn=true;
    document.getElementById('bell-pill').classList.add('gold');
    reschedule();
  } else if(Notification.permission==='default'){
    document.getElementById('notif-banner').classList.add('show');
  }

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); deferredPrompt=e;
    if(!window.matchMedia('(display-mode: standalone)').matches)
      document.getElementById('install-banner').classList.add('show');
  });

  render();
  fetchScores(); // first fetch immediately
  // Poll every 60s — doubles to 30s when a match is live
  fetchInterval = setInterval(()=>{
    const anyLive = M.some(m=>isLive(m.u));
    fetchScores();
    if(anyLive) clearInterval(fetchInterval),
      fetchInterval=setInterval(fetchScores, 30000);
  }, 60000);
});

// ======= SCORE FETCH =======
async function fetchScores(){
  try {
    const res = await fetch('https://api.football-data.org/v4/competitions/WC/matches', {
      headers:{'X-Auth-Token': API_KEY}
    });
    if(!res.ok) return;
    const data = await res.json();
    let changed = false;

    data.matches.forEach(m=>{
      const status = m.status; // SCHEDULED, IN_PLAY, PAUSED, FINISHED, SUSPENDED
      if(!['IN_PLAY','PAUSED','FINISHED'].includes(status)) return;

      const hn = NAME_MAP[m.homeTeam.name] || m.homeTeam.name;
      const an = NAME_MAP[m.awayTeam.name] || m.awayTeam.name;
      const key = `${hn}|${an}`;

      const ft = m.score.fullTime;
      const ht = m.score.halfTime;
      const gh = ft.home !== null ? ft.home : (ht.home !== null ? ht.home : null);
      const ga = ft.away !== null ? ft.away : (ht.away !== null ? ht.away : null);

      if(gh !== null && ga !== null){
        const scoreStr = `${gh}-${ga}`;
        if(LIVE_SCORES[key] !== scoreStr){ LIVE_SCORES[key]=scoreStr; changed=true; }
      }

      // Track live minute
      if(status==='PAUSED'){
        if(LIVE_MINS[key] !== 'Half-Time'){ LIVE_MINS[key]='Half-Time'; changed=true; }
      } else if(status==='IN_PLAY'){
        const min = m.minute ? `${m.minute}'` : 'LIVE';
        if(LIVE_MINS[key] !== min){ LIVE_MINS[key]=min; changed=true; }
      } else {
        if(LIVE_MINS[key]){ delete LIVE_MINS[key]; changed=true; }
      }
    });

    if(changed) render();
  } catch(e){ /* silently fail, offline or rate limited */ }
}

function getScore(m){
  return LIVE_SCORES[`${m.h}|${m.a}`] || null;
}

function getLiveMin(m){
  return LIVE_MINS[`${m.h}|${m.a}`] || null;
}

// ======= INSTALL =======
async function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const r=await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('install-banner').classList.remove('show');
  if(r.outcome==='accepted') toast('✅ App installed!');
}

// ======= NOTIFICATIONS =======
async function enableNotifs(){
  if(!('Notification' in window)){toast('❌ Not supported');return;}
  const p=await Notification.requestPermission();
  if(p==='granted'){
    notifOn=true;
    document.getElementById('bell-pill').classList.add('gold');
    document.getElementById('notif-banner').classList.remove('show');
    toast('🔔 Notifications enabled!');
    reschedule(); render();
  } else { toast('❌ Permission denied'); }
}

async function toggleAllNotifs(){
  if(!notifOn){enableNotifs();return;}
  const now=new Date(); let count=0;
  M.forEach(m=>{
    const at=new Date(new Date(m.u)-30*60000);
    if(at>now && !notifMap[m.id]){notifMap[m.id]=true;count++;}
  });
  saveNotifs(); reschedule();
  toast(`🔔 ${count} reminders set!`); render();
}

function toggleNotif(id){
  if(!notifOn){enableNotifs();return;}
  notifMap[id]=!notifMap[id]; saveNotifs();
  if(notifMap[id]){scheduleOne(M.find(m=>m.id===id));toast('🔔 Reminder set!');}
  else{clearTimer(id);toast('🔕 Reminder removed');}
  render();
}

function saveNotifs(){localStorage.setItem('wc_n',JSON.stringify(notifMap));}

function scheduleOne(m){
  if(!m) return;
  const at=new Date(new Date(m.u)-30*60000);
  const delay=at-new Date();
  if(delay<=0) return;
  clearTimer(m.id);
  timers[m.id]=setTimeout(()=>{
    if(!notifMap[m.id]) return;
    const title='⚽ Kick-off in 30 minutes!';
    const body=`${F[m.h]||''} ${m.h} vs ${m.a} ${F[m.a]||''}\n📍 ${m.v}`;
    const opts={body,icon:'./icons/icon-192.png',badge:'./icons/icon-96.png',
      vibrate:[200,100,200],tag:`wc-${m.id}`,renotify:false};
    if(swReg) swReg.showNotification(title,opts);
    else if(Notification.permission==='granted') new Notification(title,opts);
    notifMap[m.id]='fired'; saveNotifs();
  }, delay);
}

function clearTimer(id){if(timers[id]){clearTimeout(timers[id]);delete timers[id];}}
function reschedule(){M.forEach(m=>{if(notifMap[m.id]===true)scheduleOne(m);});}

// ======= HELPERS =======
function gl(g){const m={'R32':'R32','R16':'R16','QF':'Quarter','SF':'Semi','Final':'Final','3rd':'3rd Place'};return m[g]||'Group '+g;}
function isToday(u){const d=new Date(u),n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function isLive(u){const d=(new Date()-new Date(u))/60000;return d>=0&&d<105;}
function isDone(u){return(new Date()-new Date(u))/60000>105;}
function fmtTime(u){return new Date(u).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ======= NAV =======
function setStage(s){
  stage=s;
  document.querySelectorAll('#stage-tabs .tab').forEach((t,i)=>
    t.classList.toggle('active',['group','r32','r16','qf','sf','final'][i]===s));
  render();
}
function switchView(v){
  view=v;
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nb-'+v).classList.add('active');
  document.getElementById('stage-tabs').style.display=v==='schedule'?'flex':'none';
  render();
}

// ======= RENDER =======
function card(m){
  const live=isLive(m.u), done=isDone(m.u);
  const ko=['r32','r16','qf','sf','final'].includes(m.s);
  const score=getScore(m);
  const liveMin=getLiveMin(m);
  const hasNotif=notifMap[m.id]===true;
  const canNotif=notifOn&&!done&&!live;

  const timeBadge=live?`<span class="live-tag">LIVE</span>`:`<span class="card-time">${fmtTime(m.u)}</span>`;

  let midContent;
  if(score){
    const [sh,sa]=score.split('-');
    midContent=`<div class="score"><span class="snum">${sh}</span><span class="sdash">-</span><span class="snum">${sa}</span></div>
    ${liveMin?`<span class="live-min">${liveMin}</span>`:''}`;
  } else {
    midContent=`<span class="vs">VS</span>`;
  }

  const bellBtn=canNotif?`<div class="bell ${hasNotif?'on':''}" onclick="toggleNotif(${m.id})">${hasNotif?'🔔':'🔕'}</div>`:'';

  return `<div class="card ${live?'live':''} ${done&&!live&&!score?'done':''}" id="card-${m.id}">
    ${bellBtn}
    <div class="card-top">
      <div class="card-left">
        <span class="gbadge ${ko?'ko':''}">${gl(m.g)}</span>
        <span class="venue">📍 ${m.v}</span>
      </div>
      ${timeBadge}
    </div>
    <div class="teams">
      <div class="team"><span class="flag">${F[m.h]||'🏳️'}</span><span class="tname">${m.h}</span></div>
      <div class="mid">${midContent}</div>
      <div class="team r"><span class="tname">${m.a}</span><span class="flag">${F[m.a]||'🏳️'}</span></div>
    </div>
  </div>`;
}

function render(){
  const main=document.getElementById('main');
  if(view==='groups'){
    main.innerHTML=Object.entries(GROUPS).map(([g,teams])=>
      `<div class="gcard"><div class="gtitle">⚽ GROUP ${g}</div>
      ${teams.map((t,i)=>`<div class="gteam"><span class="grank">${i+1}</span><span>${F[t]||'🏳️'}</span><span>${t}</span></div>`).join('')}
      </div>`).join('');
    return;
  }
  if(view==='today'){
    const today=M.filter(m=>isToday(m.u));
    main.innerHTML=today.length?today.map(card).join('')
      :`<div class="empty"><div class="empty-ico">⚽</div>No matches today.<br>Check the full schedule!</div>`;
    return;
  }
  const list=M.filter(m=>m.s===stage);
  const byDate={};
  list.forEach(m=>{
    const key=new Date(m.u).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    if(!byDate[key]) byDate[key]={u:m.u,items:[]};
    byDate[key].items.push(m);
  });
  main.innerHTML=Object.entries(byDate).map(([date,data])=>
    `<div><div class="date-hd">${isToday(data.u)?'<span class="today-badge">TODAY</span>':''}${date}</div>
    ${data.items.map(card).join('')}</div>`).join('')
    ||`<div class="empty"><div class="empty-ico">🏟️</div>Matchups TBD<br>after the group stage</div>`;
}
