<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#C9A84C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WC 2026">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>World Cup 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{
  --gold:#C9A84C;--gold2:#E8C96A;--gold3:rgba(201,168,76,0.12);
  --dark:#06060E;--d2:#0C0C18;--d3:#131320;--d4:#1A1A2A;--d5:#232335;--d6:#2C2C40;
  --text:#F2F0EA;--muted:#6A6A80;--live:#E63946;--green:#2DC653;
  --pitch:#2A5C2A;--pitch2:#245224;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:-webkit-fill-available;scroll-behavior:smooth;}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ====== LAYOUT ====== */
.app-wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;}

/* ====== HERO HEADER ====== */
.hero{
  background: linear-gradient(180deg,#0D0D20 0%,var(--dark) 100%);
  border-bottom:1px solid var(--d5);
  position:sticky;top:0;z-index:100;
}
.hero-inner{max-width:1100px;margin:0 auto;padding:0 20px;}
.hero-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 10px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-badge{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--d4),var(--d5));
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:0 0 20px rgba(201,168,76,0.2);
}
.brand-text .name{
  font-family:'Bebas Neue',sans-serif;font-size:22px;
  letter-spacing:3px;color:var(--gold);line-height:1;
}
.brand-text .sub{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:1px;display:block;}
.header-right{display:flex;align-items:center;gap:8px;}
.hpill{
  background:var(--d3);border:1px solid var(--d5);border-radius:20px;
  padding:5px 11px;font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:5px;cursor:pointer;
  transition:all 0.15s;font-family:'Inter',sans-serif;font-weight:500;
}
.hpill.active{border-color:var(--gold);color:var(--gold);background:var(--gold3);}
.hpill .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.hpill .dot-live{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.4s infinite;}

/* TABS */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;background:none;border:1px solid var(--d5);
  border-radius:20px;padding:5px 14px;font-size:11px;font-weight:500;
  color:var(--muted);cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;
}
.tab.active{background:var(--gold);border-color:var(--gold);color:var(--dark);font-weight:800;}

/* BANNERS */
.banner{display:none;padding:9px 20px;align-items:center;gap:10px;border-bottom:1px solid;}
.banner.show{display:flex;}
.b-install{background:#0C1525;border-color:#1E4A80;}
.b-notif{background:#0A1510;border-color:#1A4020;}
.b-txt{flex:1;font-size:12px;line-height:1.4;}
.b-txt b{color:var(--gold2);}
.b-notif .b-txt b{color:var(--green);}
.b-btn{border:none;border-radius:8px;padding:6px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
.b-install .b-btn{background:#1E4A80;color:#fff;}
.b-notif .b-btn{background:#1A4020;color:#fff;}
.b-close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;}

/* ====== MAIN CONTENT ====== */
.main{flex:1;padding:0 20px 100px;max-width:1100px;margin:0 auto;width:100%;}

/* PC two-column */
@media(min-width:768px){
  .main{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:16px;}
  .main.single-col{display:block;}
  .date-group{break-inside:avoid;}
}

/* DATE */
.date-hd{
  display:flex;align-items:center;gap:8px;
  padding:18px 0 8px;font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--gold);
}
.date-hd::after{content:'';flex:1;height:1px;background:var(--d4);}
.today-badge{
  background:linear-gradient(135deg,#B8860B,var(--gold));
  color:var(--dark);border-radius:4px;padding:1px 7px;
  font-size:9px;font-weight:800;letter-spacing:1px;
}

/* ====== MATCH CARD ====== */
.card{
  background:var(--d2);
  border:1px solid var(--d4);
  border-radius:14px;padding:12px 14px;margin-bottom:8px;
  position:relative;cursor:pointer;
  transition:border-color 0.2s,transform 0.1s,box-shadow 0.2s;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.3),transparent);
}
.card:hover{border-color:var(--d6);box-shadow:0 4px 24px rgba(0,0,0,0.4);}
.card:active{transform:scale(0.99);}
.card.live{border-color:var(--live);background:#0E0608;}
.card.live::before{background:linear-gradient(90deg,transparent,rgba(230,57,70,0.5),transparent);}
.card.done{opacity:0.65;}
.card.selected{border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,0.15);}

.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
.gbadge{
  background:var(--d4);border-radius:5px;padding:2px 7px;
  font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted);
  white-space:nowrap;text-transform:uppercase;flex-shrink:0;
}
.gbadge.ko{color:var(--gold);border:1px solid rgba(201,168,76,0.2);}
.venue{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.ctime{font-size:11px;font-weight:700;color:var(--gold2);white-space:nowrap;}
.live-tag{
  background:var(--live);color:white;font-size:9px;font-weight:800;
  letter-spacing:1px;border-radius:5px;padding:2px 7px;animation:blink 1.4s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}

.bell{
  position:absolute;top:10px;right:11px;
  background:var(--d4);border:1px solid var(--d5);border-radius:8px;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:12px;cursor:pointer;transition:all 0.15s;z-index:2;
}
.bell.on{background:var(--gold3);border-color:var(--gold);}
.bell:active{transform:scale(0.88);}

.teams{display:flex;align-items:center;gap:8px;padding-right:34px;}
.team{flex:1;display:flex;align-items:center;gap:7px;min-width:0;}
.team.r{flex-direction:row-reverse;}
.flag{font-size:22px;flex-shrink:0;line-height:1;}
.tname{font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team.r .tname{text-align:right;}
.mid{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:46px;}
.vs{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--muted);letter-spacing:1px;}
.scorebox{display:flex;align-items:center;gap:2px;}
.sn{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);line-height:1;min-width:16px;text-align:center;}
.sd{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted);}
.live-min{font-size:9px;color:var(--live);font-weight:700;margin-top:1px;}

/* ====== LINEUP MODAL ====== */
#lineup-modal{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
  overflow-y:auto;
}
#lineup-modal.open{display:block;}
.modal-inner{
  max-width:700px;margin:0 auto;padding:20px 16px 40px;
  min-height:100%;
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold);}
.modal-close{
  background:var(--d4);border:1px solid var(--d5);border-radius:10px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;color:var(--text);transition:all 0.15s;
}
.modal-close:hover{background:var(--d5);}

.modal-score-bar{
  background:var(--d3);border:1px solid var(--d5);border-radius:14px;
  padding:14px 16px;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.msb-team{flex:1;display:flex;align-items:center;gap:8px;}
.msb-team.r{flex-direction:row-reverse;}
.msb-flag{font-size:28px;}
.msb-name{font-size:14px;font-weight:700;}
.msb-score{
  font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--text);
  min-width:80px;text-align:center;letter-spacing:4px;
}
.msb-vs{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--muted);letter-spacing:2px;}

/* PITCH */
.pitch-wrap{
  background:var(--d3);border:1px solid var(--d5);border-radius:14px;
  overflow:hidden;margin-bottom:14px;
}
.pitch-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--d5);
}
.pitch-team-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;}
.pitch-formation{font-size:11px;color:var(--muted);}
.pitch{
  background:linear-gradient(180deg,var(--pitch) 0%,var(--pitch2) 100%);
  position:relative;aspect-ratio:7/10;width:100%;
  border-bottom:2px solid rgba(255,255,255,0.15);
}
/* Pitch markings */
.pitch::before{
  content:'';position:absolute;inset:8%;
  border:1.5px solid rgba(255,255,255,0.15);border-radius:2px;
}
.pitch-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:22%;aspect-ratio:1;border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.15);
}
.pitch-halfway{
  position:absolute;top:50%;left:8%;right:8%;height:1.5px;
  background:rgba(255,255,255,0.15);
}
.pitch-box-top{
  position:absolute;top:8%;left:22%;right:22%;
  height:18%;border:1.5px solid rgba(255,255,255,0.15);
  border-top:none;
}
.pitch-box-bot{
  position:absolute;bottom:8%;left:22%;right:22%;
  height:18%;border:1.5px solid rgba(255,255,255,0.15);
  border-bottom:none;
}
.player-dot{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:default;
}
.player-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--d4),var(--d5));
  border:2px solid rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
  overflow:hidden;
}
.player-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.player-avatar.gk{border-color:#F0B429;}
.player-label{
  background:rgba(0,0,0,0.7);border-radius:4px;
  padding:1px 5px;font-size:8px;font-weight:600;color:white;
  white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis;
  text-align:center;
}

/* SUBS TABLE */
.subs-wrap{
  background:var(--d3);border:1px solid var(--d5);border-radius:14px;
  padding:12px 14px;margin-bottom:14px;
}
.subs-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.sub-row{
  display:flex;align-items:center;gap:10px;
  padding:6px 0;border-bottom:1px solid var(--d4);
}
.sub-row:last-child{border-bottom:none;}
.sub-num{width:22px;font-size:10px;color:var(--muted);font-weight:700;text-align:right;}
.sub-name{flex:1;font-size:12px;font-weight:500;}
.sub-pos{font-size:9px;color:var(--muted);background:var(--d4);border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:1px;}

/* LOADING */
.loading-lineup{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;
}
.spinner{
  width:30px;height:30px;border:2px solid var(--d5);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin 0.8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* GROUPS */
.gcard{background:var(--d2);border:1px solid var(--d4);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.gtitle{background:var(--d3);padding:9px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--gold);border-bottom:1px solid var(--d4);}
.gteam{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--d4);font-size:13px;font-weight:500;}
.gteam:last-child{border-bottom:none;}
.grank{width:16px;font-size:10px;color:var(--muted);font-weight:700;}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;line-height:1.6;}
.empty-ico{font-size:44px;margin-bottom:12px;}

/* TOAST */
#toast{
  position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--d3);border:1px solid var(--d5);border-radius:22px;
  padding:8px 18px;font-size:12px;font-weight:500;color:var(--text);
  opacity:0;transition:all 0.25s;z-index:600;white-space:nowrap;pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* BOTTOM NAV */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(12,12,24,0.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--d4);display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.nbtn{
  flex:1;background:none;border:none;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;color:var(--muted);transition:color 0.15s;font-family:'Inter',sans-serif;
}
.nbtn.active{color:var(--gold);}
.nicon{font-size:20px;line-height:1;}
.nlabel{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}

/* PC NAV */
@media(min-width:768px){
  .nav{position:sticky;top:0;z-index:300;order:-1;border-top:none;border-bottom:1px solid var(--d4);justify-content:center;gap:0;}
  .nbtn{padding:12px 20px;flex-direction:row;gap:6px;font-size:12px;flex:0;}
  .nlabel{font-size:12px;letter-spacing:0;}
  .nicon{font-size:16px;}
  .main{padding-top:16px;}
}
</style>
</head>
<body>

<div id="lineup-modal">
  <div class="modal-inner" id="modal-content">
    <div class="loading-lineup"><div class="spinner"></div>Loading lineups...</div>
  </div>
</div>

<div class="app-wrap">
<div class="banner b-install" id="install-banner">
  <div class="b-txt"><b>📲 Install App</b> — Add to Home Screen for the full experience</div>
  <button class="b-btn" onclick="installApp()">Install</button>
  <button class="b-close" onclick="this.closest('.banner').classList.remove('show')">✕</button>
</div>
<div class="banner b-notif" id="notif-banner">
  <div class="b-txt"><b>🔔 Get match reminders</b> — notified 30 mins before kick-off</div>
  <button class="b-btn" onclick="enableNotifs()">Enable</button>
  <button class="b-close" onclick="this.closest('.banner').classList.remove('show')">✕</button>
</div>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="brand">
        <div class="brand-badge">⚽</div>
        <div class="brand-text">
          <div class="name">World Cup 2026</div>
          <span class="sub">USA · Canada · Mexico</span>
        </div>
      </div>
      <div class="header-right">
        <div class="hpill"><span class="dot"></span><span id="tz-text">Local</span></div>
        <div class="hpill" id="bell-pill" onclick="toggleAllNotifs()">🔔 Reminders</div>
      </div>
    </div>
    <div class="tabs" id="stage-tabs">
      <button class="tab active" onclick="setStage('group')">Group Stage</button>
      <button class="tab" onclick="setStage('r32')">Round of 32</button>
      <button class="tab" onclick="setStage('r16')">Round of 16</button>
      <button class="tab" onclick="setStage('qf')">Quarters</button>
      <button class="tab" onclick="setStage('sf')">Semis</button>
      <button class="tab" onclick="setStage('final')">Final</button>
    </div>
  </div>
</div>

<div class="main single-col" id="main"></div>
<div id="toast"></div>

<nav class="nav">
  <button class="nbtn active" id="nb-schedule" onclick="switchView('schedule')"><span class="nicon">📅</span><span class="nlabel">Schedule</span></button>
  <button class="nbtn" id="nb-today" onclick="switchView('today')"><span class="nicon">⚡</span><span class="nlabel">Today</span></button>
  <button class="nbtn" id="nb-groups" onclick="switchView('groups')"><span class="nicon">👥</span><span class="nlabel">Groups</span></button>
</nav>
</div>

// SCORES
async function fetchScores(){
  try{
    const res=await fetch(`${API_BASE}/competitions/WC/matches`,{headers:{'X-Auth-Token':API_KEY}});
    if(!res.ok) return;
    const data=await res.json();
    let changed=false;
    data.matches.forEach(m=>{
      const hn=NAME_MAP[m.homeTeam.name]||m.homeTeam.name;
      const an=NAME_MAP[m.awayTeam.name]||m.awayTeam.name;
      const key=`${hn}|${an}`;
      // Store API match ID for lineup fetching
      API_MATCH_IDS[key]=m.id;
      if(!['IN_PLAY','PAUSED','FINISHED'].includes(m.status)) return;
      const ft=m.score.fullTime, ht=m.score.halfTime;
      const gh=ft.home!==null?ft.home:(ht.home!==null?ht.home:null);
      const ga=ft.away!==null?ft.away:(ht.away!==null?ht.away:null);
      if(gh!==null&&ga!==null){
        const sc=`${gh}-${ga}`;
        if(LIVE_SCORES[key]!==sc){LIVE_SCORES[key]=sc;changed=true;}
      }
      if(m.status==='IN_PLAY'||m.status==='PAUSED'){
        LIVE_MINS[key]=m.minute?`${m.minute}'`:'LIVE';
      } else { delete LIVE_MINS[key]; }
    });
    if(changed) render();
  }catch(e){}
}

function getScore(m){return LIVE_SCORES[`${m.h}|${m.a}`]||null;}
function getLiveMin(m){return LIVE_MINS[`${m.h}|${m.a}`]||null;}
function getApiId(m){return API_MATCH_IDS[`${m.h}|${m.a}`]||null;}

// LINEUP MODAL
async function openLineup(matchId){
  const m=M.find(x=>x.id===matchId);
  if(!m) return;
  const modal=document.getElementById('lineup-modal');
  const content=document.getElementById('modal-content');
  modal.classList.add('open');
  document.body.style.overflow='hidden';

  const score=getScore(m);
  const live=isLive(m.u), done=isDone(m.u);
  const statusTag=live?`<span class="live-tag">LIVE ${getLiveMin(m)||''}</span>`:
    done?`<span style="font-size:11px;color:var(--muted);">FT</span>`:
    `<span style="font-size:11px;color:var(--gold2);">${fmtTime(m.u)}</span>`;

  const scoreDisplay=score?score.replace('-',' — '):'vs';

  content.innerHTML=`
    <div class="modal-header">
      <div class="modal-title">Match Details</div>
      <div class="modal-close" onclick="closeModal()">✕</div>
    </div>
    <div class="modal-score-bar">
      <div class="msb-team"><span class="msb-flag">${F[m.h]||'🏳️'}</span><span class="msb-name">${m.h}</span></div>
      <div style="text-align:center;flex-shrink:0;">
        <div class="msb-score">${scoreDisplay}</div>
        <div style="margin-top:4px;">${statusTag}</div>
        <div style="font-size:9px;color:var(--muted);margin-top:2px;">📍 ${m.v}</div>
      </div>
      <div class="msb-team r"><span class="msb-flag">${F[m.a]||'🏳️'}</span><span class="msb-name">${m.a}</span></div>
    </div>
    <div id="lineup-area">
      <div class="loading-lineup"><div class="spinner"></div>Loading lineups...</div>
    </div>`;

  // Fetch lineup from API
  const apiId=getApiId(m);
  if(apiId){
    try{
      const res=await fetch(`${API_BASE}/matches/${apiId}`,{headers:{'X-Auth-Token':API_KEY}});
      const data=await res.json();
      renderLineups(data, m);
    }catch(e){
      document.getElementById('lineup-area').innerHTML=
        `<div class="loading-lineup">⚽ Lineups not available yet.<br><span style="font-size:11px;">Usually published 1 hour before kick-off.</span></div>`;
    }
  } else {
    document.getElementById('lineup-area').innerHTML=
      `<div class="loading-lineup">⚽ Lineups not available yet.<br><span style="font-size:11px;">Usually published 1 hour before kick-off.</span></div>`;
  }
}

function renderLineups(data, m){
  const area=document.getElementById('lineup-area');
  const hLineup=data.lineups&&data.lineups[0];
  const aLineup=data.lineups&&data.lineups[1];

  if(!hLineup||!hLineup.startXI||hLineup.startXI.length===0){
    area.innerHTML=`<div class="loading-lineup">⚽ Lineups not available yet.<br><span style="font-size:11px;">Usually published 1 hour before kick-off.</span></div>`;
    return;
  }

  const hTeam=NAME_MAP[hLineup.team.name]||m.h;
  const aTeam=NAME_MAP[aLineup.team.name]||m.a;

  area.innerHTML=`
    ${pitchHTML(hLineup, hTeam, 'home')}
    ${pitchHTML(aLineup, aTeam, 'away')}
    ${subsHTML(hLineup, hTeam)}
    ${subsHTML(aLineup, aTeam)}`;
}

function pitchHTML(lineup, teamName, side){
  const formation=lineup.formation||'?';
  const players=lineup.startXI||[];

  // Parse formation into rows e.g. "4-3-3" -> [4,3,3]
  const rows=formation.split('-').map(Number);
  // positions: GK at bottom, then rows from defense to attack
  // We'll place GK first, then each row
  const allRows=[[players[0]]]; // GK
  let idx=1;
  rows.forEach(n=>{ allRows.push(players.slice(idx,idx+n)); idx+=n; });

  // For home team: GK at bottom (high y%), attack at top
  // For away team: GK at top (low y%), attack at bottom
  const isHome=side==='home';
  const rowCount=allRows.length; // GK + formation rows

  let playersHTML='';
  allRows.forEach((row,ri)=>{
    // ri=0 is GK, ri=rowCount-1 is attack
    let yPct;
    if(isHome){
      // GK near bottom (85%), attack near top (15%)
      yPct=85-(ri*(70/(rowCount-1)));
    } else {
      // GK near top (15%), attack near bottom (85%)
      yPct=15+(ri*(70/(rowCount-1)));
    }
    row.forEach((p,pi)=>{
      if(!p||!p.player) return;
      const name=p.player.name||'';
      const shortName=name.split(' ').pop();
      const num=p.player.shirtNumber||'';
      const isGK=ri===0;
      const xPct=row.length===1?50:10+(pi*(80/(row.length-1)));
      const imgUrl=p.player.photo||'';
      playersHTML+=`<div class="player-dot" style="left:${xPct}%;top:${yPct}%;">
        <div class="player-avatar ${isGK?'gk':''}">
          ${imgUrl?`<img src="${imgUrl}" onerror="this.style.display='none';this.parentNode.textContent='${num}'" loading="lazy">`:`${num}`}
        </div>
        <div class="player-label">${shortName}</div>
      </div>`;
    });
  });

  return `<div class="pitch-wrap">
    <div class="pitch-header">
      <div class="pitch-team-label">${F[teamName]||''} ${teamName}</div>
      <div class="pitch-formation">${formation}</div>
    </div>
    <div class="pitch">
      <div class="pitch-halfway"></div>
      <div class="pitch-center"></div>
      <div class="pitch-box-top"></div>
      <div class="pitch-box-bot"></div>
      ${playersHTML}
    </div>
  </div>`;
}

function subsHTML(lineup, teamName){
  const subs=lineup.bench||[];
  if(!subs.length) return '';
  return `<div class="subs-wrap">
    <div class="subs-title">${F[teamName]||''} ${teamName} — Substitutes</div>
    ${subs.map(p=>{
      if(!p||!p.player) return '';
      const pos=p.player.position||'';
      const posShort={'Goalkeeper':'GK','Defender':'DEF','Midfielder':'MID','Forward':'FWD'}[pos]||pos.slice(0,3);
      return `<div class="sub-row">
        <span class="sub-num">${p.player.shirtNumber||'-'}</span>
        <span class="sub-name">${p.player.name||''}</span>
        <span class="sub-pos">${posShort}</span>
      </div>`;
    }).join('')}
  </div>`;
}

function closeModal(){
  document.getElementById('lineup-modal').classList.remove('open');
  document.body.style.overflow='';
}

// INSTALL
async function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const r=await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('install-banner').classList.remove('show');
  if(r.outcome==='accepted') toast('✅ App installed!');
}

// NOTIFICATIONS
async function enableNotifs(){
  if(!('Notification' in window)){toast('❌ Not supported');return;}
  const p=await Notification.requestPermission();
  if(p==='granted'){
    notifOn=true;
    document.getElementById('bell-pill').classList.add('active');
    document.getElementById('notif-banner').classList.remove('show');
    toast('🔔 Enabled!'); reschedule(); render();
  } else { toast('❌ Permission denied'); }
}
async function toggleAllNotifs(){
  if(!notifOn){enableNotifs();return;}
  const now=new Date(); let count=0;
  M.forEach(m=>{
    const at=new Date(new Date(m.u)-30*60000);
    if(at>now&&!notifMap[m.id]){notifMap[m.id]=true;count++;}
  });
  saveNotifs(); reschedule();
  toast(`🔔 ${count} reminders set!`); render();
}
function toggleNotif(e,id){
  e.stopPropagation();
  if(!notifOn){enableNotifs();return;}
  notifMap[id]=!notifMap[id]; saveNotifs();
  if(notifMap[id]){scheduleOne(M.find(m=>m.id===id));toast('🔔 Reminder set!');}
  else{clearTimer(id);toast('🔕 Removed');}
  render();
}
function saveNotifs(){localStorage.setItem('wc_n',JSON.stringify(notifMap));}
function scheduleOne(m){
  if(!m) return;
  const at=new Date(new Date(m.u)-30*60000), delay=at-new Date();
  if(delay<=0) return; clearTimer(m.id);
  timers[m.id]=setTimeout(()=>{
    if(!notifMap[m.id]) return;
    const title='⚽ Kick-off in 30 minutes!';
    const body=`${F[m.h]||''} ${m.h} vs ${m.a} ${F[m.a]||''}\n📍 ${m.v}`;
    const opts={body,icon:'./icons/icon-192.png',badge:'./icons/icon-96.png',vibrate:[200,100,200],tag:`wc-${m.id}`,renotify:false};
    if(swReg) swReg.showNotification(title,opts);
    else if(Notification.permission==='granted') new Notification(title,opts);
    notifMap[m.id]='fired'; saveNotifs();
  },delay);
}
function clearTimer(id){if(timers[id]){clearTimeout(timers[id]);delete timers[id];}}
function reschedule(){M.forEach(m=>{if(notifMap[m.id]===true)scheduleOne(m);});}

// HELPERS
function gl(g){const m={'R32':'R32','R16':'R16','QF':'Quarter','SF':'Semi','Final':'Final','3rd':'3rd Place'};return m[g]||'Group '+g;}
function isToday(u){const d=new Date(u),n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function isLive(u){const d=(new Date()-new Date(u))/60000;return d>=0&&d<105;}
function isDone(u){return(new Date()-new Date(u))/60000>105;}
function fmtTime(u){return new Date(u).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// NAV
function setStage(s){
  stage=s;
  document.querySelectorAll('#stage-tabs .tab').forEach((t,i)=>
    t.classList.toggle('active',['group','r32','r16','qf','sf','final'][i]===s));
  render();
}
function switchView(v){
  view=v;
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nb-'+v).classList.add('active');
  document.getElementById('stage-tabs').style.display=v==='schedule'?'flex':'none';
  const main=document.getElementById('main');
  main.className=v==='groups'?'main':'main single-col';
  render();
}

// RENDER
function card(m){
  const live=isLive(m.u),done=isDone(m.u);
  const ko=['r32','r16','qf','sf','final'].includes(m.s);
  const score=getScore(m), liveMin=getLiveMin(m);
  const hasNotif=notifMap[m.id]===true;
  const canNotif=notifOn&&!done&&!live;
  const timeBadge=live?`<span class="live-tag">LIVE ${liveMin||''}</span>`:`<span class="ctime">${fmtTime(m.u)}</span>`;
  let midContent;
  if(score){
    const[sh,sa]=score.split('-');
    midContent=`<div class="scorebox"><span class="sn">${sh}</span><span class="sd">-</span><span class="sn">${sa}</span></div>`;
  } else { midContent=`<span class="vs">VS</span>`; }
  const bellBtn=canNotif?`<div class="bell ${hasNotif?'on':''}" onclick="toggleNotif(event,${m.id})">${hasNotif?'🔔':'🔕'}</div>`:'';
  return `<div class="card ${live?'live':''} ${done&&!live&&!score?'done':''}" onclick="openLineup(${m.id})">
    ${bellBtn}
    <div class="card-top">
      <div class="card-left">
        <span class="gbadge ${ko?'ko':''}">${gl(m.g)}</span>
        <span class="venue">📍 ${m.v}</span>
      </div>
      ${timeBadge}
    </div>
    <div class="teams">
      <div class="team"><span class="flag">${F[m.h]||'🏳️'}</span><span class="tname">${m.h}</span></div>
      <div class="mid">${midContent}</div>
      <div class="team r"><span class="tname">${m.a}</span><span class="flag">${F[m.a]||'🏳️'}</span></div>
    </div>
  </div>`;
}

function render(){
  const main=document.getElementById('main');
  if(view==='groups'){
    main.className='main';
    main.innerHTML=Object.entries(GROUPS).map(([g,teams])=>
      `<div class="gcard"><div class="gtitle">⚽ GROUP ${g}</div>
      ${teams.map((t,i)=>`<div class="gteam"><span class="grank">${i+1}</span><span>${F[t]||'🏳️'}</span><span>${t}</span></div>`).join('')}
      </div>`).join('');
    return;
  }
  main.className='main single-col';
  if(view==='today'){
    const today=M.filter(m=>isToday(m.u));
    main.innerHTML=today.length?today.map(card).join('')
      :`<div class="empty"><div class="empty-ico">⚽</div>No matches today.<br>Check the full schedule!</div>`;
    return;
  }
  const list=M.filter(m=>m.s===stage);
  const byDate={};
  list.forEach(m=>{
    const key=new Date(m.u).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    if(!byDate[key]) byDate[key]={u:m.u,items:[]};
    byDate[key].items.push(m);
  });
  main.innerHTML=Object.entries(byDate).map(([date,data])=>
    `<div class="date-group"><div class="date-hd">${isToday(data.u)?'<span class="today-badge">TODAY</span>':''}${date}</div>
    ${data.items.map(card).join('')}</div>`).join('')
    ||`<div class="empty"><div class="empty-ico">🏟️</div>Matchups TBD<br>after the group stage</div>`;
}
</script>
</body>
</html>
