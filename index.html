@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
  --gold: #C9A84C;
  --gold2: #E8C96A;
  --dark: #08080E;
  --d2: #0F0F18;
  --d3: #171724;
  --d4: #1F1F2E;
  --d5: #2A2A3C;
  --text: #F2F0EA;
  --muted: #7A7A90;
  --live: #E63946;
  --green: #2DC653;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { height: -webkit-fill-available; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overflow-x: hidden;
}

/* BANNER */
.banner {
  display: none;
  padding: 10px 14px;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}
.banner.show { display: flex; }
.banner-install { background: #0F1A2A; border-color: #2A6496; }
.banner-notif { background: #0F1A14; border-color: #1E5C2A; }
.banner-text { flex:1; font-size: 12px; line-height: 1.4; }
.banner-text b { font-size: 12px; }
.banner-install .banner-text b { color: #6AB0F5; }
.banner-notif .banner-text b { color: var(--green); }
.banner-btn {
  border: none; border-radius: 8px; padding: 7px 14px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: 'Inter', sans-serif; white-space: nowrap;
}
.banner-install .banner-btn { background: #2A6496; color: white; }
.banner-notif .banner-btn { background: #1E5C2A; color: white; }
.banner-close { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px; }

/* HEADER */
.header {
  background: var(--dark);
  position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid var(--d4);
}
.header-inner {
  max-width: 480px; margin: 0 auto;
  padding: 12px 16px 10px;
}
.header-top {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 12px;
}
.brand { display:flex; align-items:center; gap:10px; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #1F1F2E, #2A2A3C);
  border: 1px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.brand-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; letter-spacing: 2px; color: var(--gold); line-height: 1;
}
.brand-sub {
  font-size: 9px; color: var(--muted); letter-spacing: 2px;
  text-transform: uppercase; display: block; margin-top: 1px;
}
.header-actions { display:flex; align-items:center; gap:6px; }
.pill {
  background: var(--d3); border: 1px solid var(--d4);
  border-radius: 20px; padding: 5px 10px;
  font-size: 10px; color: var(--muted);
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; transition: all 0.15s;
  font-family: 'Inter', sans-serif; font-weight: 500;
}
.pill:active { background: var(--d4); }
.pill.gold { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.1); }
.pill-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); }

/* STAGE TABS */
.tabs {
  display:flex; gap:5px; overflow-x:auto;
  padding-bottom:1px; scrollbar-width:none;
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0; background:none; border:1px solid var(--d5);
  border-radius:20px; padding:5px 13px; font-size:11px;
  font-weight:500; color:var(--muted); cursor:pointer;
  transition:all 0.15s; font-family:'Inter',sans-serif;
  letter-spacing: 0.2px;
}
.tab.active {
  background: var(--gold); border-color: var(--gold);
  color: var(--dark); font-weight:700;
}

/* MAIN */
.main { max-width:480px; margin:0 auto; padding:8px 14px 86px; }

/* DATE HEADER */
.date-hd {
  display: flex; align-items: center; gap: 8px;
  padding: 18px 0 8px; font-size:10px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase; color:var(--gold);
}
.date-hd::after { content:''; flex:1; height:1px; background:var(--d4); }
.today-badge {
  background:var(--gold); color:var(--dark);
  border-radius:4px; padding:1px 6px;
  font-size:9px; font-weight:800; letter-spacing:1px;
}

/* MATCH CARD */
.card {
  background: var(--d2);
  border: 1px solid var(--d4);
  border-radius: 14px;
  padding: 11px 13px;
  margin-bottom: 8px;
  position: relative;
  transition: border-color 0.2s, transform 0.1s;
}
.card:active { transform: scale(0.99); }
.card.live { border-color: var(--live); background: #120A0B; }
.card.done { opacity: 0.6; }

.card-top {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 9px;
}
.card-left { display:flex; align-items:center; gap:5px; flex:1; min-width:0; }
.gbadge {
  background:var(--d4); border-radius:5px;
  padding:2px 7px; font-size:9px; font-weight:700;
  letter-spacing:1px; color:var(--muted); white-space:nowrap;
  text-transform: uppercase;
}
.gbadge.ko { color:var(--gold); border:1px solid rgba(201,168,76,0.25); }
.venue {
  font-size:9px; color:var(--muted);
  white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:110px;
}
.card-time { font-size:11px; font-weight:700; color:var(--gold2); white-space:nowrap; }
.live-tag {
  background:var(--live); color:white;
  font-size:9px; font-weight:800; letter-spacing:1px;
  border-radius:5px; padding:2px 7px;
  animation: blink 1.4s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* NOTIF BELL */
.bell {
  position:absolute; top:9px; right:10px;
  background:var(--d4); border:1px solid var(--d5);
  border-radius:8px; width:28px; height:28px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; cursor:pointer; transition:all 0.15s;
}
.bell.on { background:rgba(201,168,76,0.15); border-color:var(--gold); }
.bell:active { transform:scale(0.92); }

/* TEAMS */
.teams { display:flex; align-items:center; gap:6px; padding-right:36px; }
.team { flex:1; display:flex; align-items:center; gap:7px; min-width:0; }
.team.r { flex-direction:row-reverse; }
.flag { font-size:20px; flex-shrink:0; line-height:1; }
.tname {
  font-size:13px; font-weight:600; line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.team.r .tname { text-align:right; }
.mid { display:flex; flex-direction:column; align-items:center; flex-shrink:0; min-width:44px; }
.vs { font-family:'Bebas Neue',sans-serif; font-size:13px; color:var(--muted); letter-spacing:1px; }
.score { display:flex; align-items:center; gap:3px; }
.snum {
  font-family:'Bebas Neue',sans-serif; font-size:24px;
  color:var(--text); line-height:1; min-width:14px; text-align:center;
}
.sdash { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--muted); }

/* GROUPS */
.gcard {
  background:var(--d2); border:1px solid var(--d4);
  border-radius:14px; margin-bottom:10px; overflow:hidden;
}
.gtitle {
  background:var(--d3); padding:9px 14px;
  font-family:'Bebas Neue',sans-serif;
  font-size:15px; letter-spacing:2px; color:var(--gold);
  border-bottom:1px solid var(--d4); display:flex;
  align-items:center; gap:8px;
}
.gteam {
  display:flex; align-items:center; gap:10px;
  padding:9px 14px; border-bottom:1px solid var(--d4);
  font-size:13px; font-weight:500;
}
.gteam:last-child { border-bottom:none; }
.grank { width:16px; font-size:10px; color:var(--muted); font-weight:700; }

/* EMPTY */
.empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; line-height:1.6; }
.empty-ico { font-size:44px; margin-bottom:12px; }

/* TOAST */
#toast {
  position:fixed; bottom:82px; left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--d3); border:1px solid var(--d5);
  border-radius:22px; padding:8px 18px;
  font-size:12px; font-weight:500; color:var(--text);
  opacity:0; transition:all 0.25s; z-index:300;
  white-space:nowrap; pointer-events:none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* BOTTOM NAV */
.nav {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--d2); border-top:1px solid var(--d4);
  display:flex; z-index:200;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.nbtn {
  flex:1; background:none; border:none;
  padding:10px 4px; display:flex; flex-direction:column;
  align-items:center; gap:3px; cursor:pointer;
  color:var(--muted); transition:color 0.15s;
  font-family:'Inter',sans-serif;
}
.nbtn.active { color:var(--gold); }
.nicon { font-size:20px; line-height:1; }
.nlabel { font-size:9px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; }

/* SCORE UPDATE FLASH */
@keyframes scoreFlash { 0%{background:rgba(201,168,76,0.3)} 100%{background:transparent} }
.score-updated { animation: scoreFlash 1s ease-out; }
</style>
</head>

// ======= STATE =======
let stage = 'group', view = 'schedule';
let notifOn = false;
let notifMap = JSON.parse(localStorage.getItem('wc_n') || '{}');
let timers = {}, swReg = null, deferredPrompt = null;

// ======= BOOT =======
window.addEventListener('DOMContentLoaded', () => {
  // TZ
  const tzShort = new Date().toLocaleDateString('en-US',{timeZoneName:'short'}).split(', ')[1] || 'Local';
  document.getElementById('tz-text').textContent = tzShort;

  // SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(r => { swReg = r; }).catch(()=>{});
  }

  // Notif state
  if ('Notification' in window && Notification.permission === 'granted') {
    notifOn = true;
    document.getElementById('bell-pill').classList.add('gold');
    reschedule();
  } else if (Notification.permission === 'default') {
    document.getElementById('notif-banner').classList.add('show');
  }

  // Install prompt
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt = e;
    if (!window.matchMedia('(display-mode: standalone)').matches)
      document.getElementById('install-banner').classList.add('show');
  });

  // Auto-refresh scores every 60s during likely match times
  setInterval(refreshScores, 60000);

  render();
});

// ======= SCORE REFRESH =======
async function refreshScores() {
  // We update SCORES object manually — in a real app this would hit an API
  // For now we just re-render to catch any time-based state changes (live/done)
  render();
}

// ======= INSTALL =======
async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const r = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
  if (r.outcome === 'accepted') toast('✅ App installed!');
}

// ======= NOTIFICATIONS =======
async function enableNotifs() {
  if (!('Notification' in window)) { toast('❌ Not supported'); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') {
    notifOn = true;
    document.getElementById('bell-pill').classList.add('gold');
    document.getElementById('notif-banner').classList.remove('show');
    toast('🔔 Notifications enabled!');
    reschedule();
    render();
  } else {
    toast('❌ Permission denied');
  }
}

async function toggleAllNotifs() {
  if (!notifOn) { enableNotifs(); return; }
  const now = new Date();
  let count = 0;
  M.forEach(m => {
    const notifAt = new Date(new Date(m.u) - 30 * 60000);
    if (notifAt > now && !notifMap[m.id]) {
      notifMap[m.id] = true; count++;
    }
  });
  saveNotifs(); reschedule();
  toast(`🔔 ${count} reminders set!`);
  render();
}

function toggleNotif(id) {
  if (!notifOn) { enableNotifs(); return; }
  notifMap[id] = !notifMap[id];
  saveNotifs();
  if (notifMap[id]) {
    scheduleOne(M.find(m => m.id === id));
    toast('🔔 Reminder set!');
  } else {
    clearTimer(id);
    toast('🔕 Reminder removed');
  }
  // Just re-render the one card
  render();
}

function saveNotifs() { localStorage.setItem('wc_n', JSON.stringify(notifMap)); }

function scheduleOne(m) {
  if (!m) return;
  const notifAt = new Date(new Date(m.u) - 30 * 60000);
  const delay = notifAt - new Date();
  if (delay <= 0) return;
  clearTimer(m.id);
  timers[m.id] = setTimeout(() => {
    // Only fire ONE notification per match
    if (!notifMap[m.id]) return;
    const title = '⚽ Kick-off in 30 minutes!';
    const body = `${F[m.h]||''} ${m.h} vs ${m.a} ${F[m.a]||''}\n📍 ${m.v}`;
    const opts = { body, icon:'./icons/icon-192.png', badge:'./icons/icon-96.png',
      vibrate:[200,100,200], tag:`wc-${m.id}`, renotify:false };
    if (swReg) swReg.showNotification(title, opts);
    else if (Notification.permission === 'granted') new Notification(title, opts);
    // Mark as fired so it never fires again
    notifMap[m.id] = 'fired';
    saveNotifs();
  }, delay);
}

function clearTimer(id) {
  if (timers[id]) { clearTimeout(timers[id]); delete timers[id]; }
}

function reschedule() {
  M.forEach(m => { if (notifMap[m.id] === true) scheduleOne(m); });
}

// ======= HELPERS =======
function gl(g) {
  const map = {'R32':'R32','R16':'R16','QF':'Quarter','SF':'Semi','Final':'Final','3rd':'3rd Place'};
  return map[g] || 'Group ' + g;
}
function isToday(u) {
  const d = new Date(u), n = new Date();
  return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}
function isLive(u) { const d=(new Date()-new Date(u))/60000; return d>=0&&d<105; }
function isDone(u) { return (new Date()-new Date(u))/60000 > 105; }
function fmtTime(u) { return new Date(u).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ======= NAV =======
function setStage(s) {
  stage = s;
  document.querySelectorAll('#stage-tabs .tab').forEach((t,i)=>{
    t.classList.toggle('active',['group','r32','r16','qf','sf','final'][i]===s);
  });
  render();
}

function switchView(v) {
  view = v;
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nb-'+v).classList.add('active');
  document.getElementById('stage-tabs').style.display = v==='schedule'?'flex':'none';
  render();
}

// ======= RENDER =======
function card(m) {
  const live = isLive(m.u), done = isDone(m.u);
  const ko = ['r32','r16','qf','sf','final'].includes(m.s);
  const score = SCORES[m.id];
  const hasNotif = notifMap[m.id] === true;
  const canNotif = notifOn && !done && !live;

  const timeBadge = live
    ? `<span class="live-tag">LIVE</span>`
    : `<span class="card-time">${fmtTime(m.u)}</span>`;

  const midContent = (done && score)
    ? `<div class="score"><span class="snum">${score.split('-')[0]}</span><span class="sdash">-</span><span class="snum">${score.split('-')[1]}</span></div>`
    : `<span class="vs">VS</span>`;

  const bellBtn = canNotif
    ? `<div class="bell ${hasNotif?'on':''}" onclick="toggleNotif(${m.id})" title="${hasNotif?'Remove reminder':'Set reminder'}">${hasNotif?'🔔':'🔕'}</div>`
    : '';

  return `<div class="card ${live?'live':''} ${done&&!live?'done':''}" id="card-${m.id}">
    ${bellBtn}
    <div class="card-top">
      <div class="card-left">
        <span class="gbadge ${ko?'ko':''}">${gl(m.g)}</span>
        <span class="venue">📍 ${m.v}</span>
      </div>
      ${timeBadge}
    </div>
    <div class="teams">
      <div class="team"><span class="flag">${F[m.h]||'🏳️'}</span><span class="tname">${m.h}</span></div>
      <div class="mid">${midContent}</div>
      <div class="team r"><span class="tname">${m.a}</span><span class="flag">${F[m.a]||'🏳️'}</span></div>
    </div>
  </div>`;
}

function render() {
  const main = document.getElementById('main');

  if (view === 'groups') {
    main.innerHTML = Object.entries(GROUPS).map(([g,teams])=>
      `<div class="gcard">
        <div class="gtitle">⚽ GROUP ${g}</div>
        ${teams.map((t,i)=>`<div class="gteam"><span class="grank">${i+1}</span><span>${F[t]||'🏳️'}</span><span>${t}</span></div>`).join('')}
      </div>`
    ).join('');
    return;
  }

  if (view === 'today') {
    const today = M.filter(m=>isToday(m.u));
    main.innerHTML = today.length
      ? today.map(card).join('')
      : `<div class="empty"><div class="empty-ico">⚽</div>No matches today.<br>Check the full schedule!</div>`;
    return;
  }

  // Schedule
  const list = M.filter(m=>m.s===stage);
  const byDate = {};
  list.forEach(m=>{
    const key = new Date(m.u).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    if (!byDate[key]) byDate[key]={u:m.u,items:[]};
    byDate[key].items.push(m);
  });

  const html = Object.entries(byDate).map(([date,data])=>`
    <div>
      <div class="date-hd">${isToday(data.u)?'<span class="today-badge">TODAY</span>':''}${date}</div>
      ${data.items.map(card).join('')}
    </div>`).join('');

  main.innerHTML = html || `<div class="empty"><div class="empty-ico">🏟️</div>Matchups TBD<br>after the group stage</div>`;
}
</script>
