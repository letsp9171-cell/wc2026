<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --gold: #C9A84C;
  --gold-light: #E8C96A;
  --dark: #0A0A0F;
  --dark2: #111118;
  --dark3: #1A1A24;
  --dark4: #22222F;
  --text: #F0EEE8;
  --muted: #8A8899;
  --live: #FF3B3B;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overflow-x: hidden;
}

/* INSTALL BANNER */
#install-banner {
  display: none;
  background: linear-gradient(135deg, #1A1A24, #22222F);
  border-bottom: 1px solid var(--gold);
  padding: 10px 16px;
  align-items: center;
  gap: 10px;
  max-width: 480px;
  margin: 0 auto;
}
#install-banner.show { display: flex; }
.install-text { flex: 1; font-size: 12px; color: var(--text); line-height: 1.4; }
.install-text strong { color: var(--gold); }
.install-btn {
  background: var(--gold);
  color: var(--dark);
  border: none;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
}
.install-close {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  padding: 2px;
}

/* NOTIF BANNER */
#notif-banner {
  display: none;
  background: #0F1A12;
  border-bottom: 1px solid #3D7A5C;
  padding: 10px 16px;
  align-items: center;
  gap: 10px;
  max-width: 480px;
  margin: 0 auto;
}
#notif-banner.show { display: flex; }
.notif-text { flex: 1; font-size: 12px; color: var(--text); line-height: 1.4; }
.notif-text strong { color: #6DD99A; }
.notif-btn {
  background: #3D7A5C;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
}

/* HEADER */
.header {
  background: var(--dark);
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 0 16px;
  border-bottom: 1px solid var(--dark4);
}
.header-inner {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 0 10px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.trophy { font-size: 20px; }
.brand-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--gold);
  line-height: 1;
}
.brand-sub {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  display: block;
  margin-top: 1px;
}
.header-right { display: flex; align-items: center; gap: 6px; }
.tz-pill {
  background: var(--dark3);
  border: 1px solid var(--dark4);
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 10px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.tz-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); }
.bell-btn {
  background: var(--dark3);
  border: 1px solid var(--dark4);
  border-radius: 20px;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  cursor: pointer;
}
.bell-btn.active { border-color: var(--gold); background: rgba(201,168,76,0.15); }

/* TABS */
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  background: none;
  border: 1px solid var(--dark4);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Inter', sans-serif;
}
.tab.active {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--dark);
  font-weight: 700;
}

/* MAIN */
.main {
  max-width: 480px;
  margin: 0 auto;
  padding: 12px 16px 90px;
}

/* DATE GROUP */
.date-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
  padding: 16px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.date-label::after { content:''; flex:1; height:1px; background:var(--dark4); }
.date-today {
  background: var(--gold);
  color: var(--dark);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
}

/* MATCH CARD */
.match-card {
  background: var(--dark2);
  border: 1px solid var(--dark4);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.15s;
}
.match-card.is-live { border-color: var(--live); background: #150A0A; }
.match-card.is-done { opacity: 0.65; }

.match-card .notif-toggle {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--dark3);
  border: 1px solid var(--dark4);
  border-radius: 8px;
  padding: 3px 7px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  z-index: 2;
}
.match-card .notif-toggle.on {
  background: rgba(201,168,76,0.2);
  border-color: var(--gold);
}

.match-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding-right: 52px;
}
.match-meta { display: flex; align-items: center; gap: 6px; }
.group-badge {
  background: var(--dark3);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
}
.group-badge.knockout { color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
.venue-text {
  font-size: 9px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 110px;
}
.match-time { font-size: 11px; font-weight: 600; color: var(--gold-light); }
.live-badge {
  background: var(--live);
  color: white;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  border-radius: 4px;
  padding: 2px 6px;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

/* TEAMS */
.teams-row { display: flex; align-items: center; gap: 8px; }
.team { flex:1; display:flex; align-items:center; gap:8px; }
.team.right { flex-direction:row-reverse; text-align:right; }
.flag { font-size: 22px; line-height:1; flex-shrink:0; }
.team-name { font-size: 13px; font-weight: 600; line-height:1.2; flex:1; }
.team.right .team-name { text-align:right; }
.vs-block { display:flex; flex-direction:column; align-items:center; flex-shrink:0; min-width:40px; }
.vs-text { font-family:'Bebas Neue',sans-serif; font-size:13px; color:var(--muted); letter-spacing:1px; }
.score-block { display:flex; align-items:center; gap:4px; }
.score-num { font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--text); line-height:1; min-width:16px; text-align:center; }
.score-sep { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--muted); }

/* GROUPS VIEW */
.group-card {
  background: var(--dark2);
  border: 1px solid var(--dark4);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}
.group-title {
  background: var(--dark3);
  padding: 8px 14px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  color: var(--gold);
  border-bottom: 1px solid var(--dark4);
}
.group-team {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--dark4);
  font-size: 13px;
  font-weight: 500;
}
.group-team:last-child { border-bottom: none; }
.team-rank { width:16px; font-size:10px; color:var(--muted); font-weight:700; }

/* EMPTY */
.empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
.empty-icon { font-size:40px; margin-bottom:12px; }

/* TOAST */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--dark3);
  border: 1px solid var(--gold);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 12px;
  color: var(--text);
  opacity: 0;
  transition: all 0.3s;
  z-index: 200;
  white-space: nowrap;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--dark2);
  border-top: 1px solid var(--dark4);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-btn {
  flex: 1;
  background: none;
  border: none;
  padding: 10px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  color: var(--muted);
  transition: color 0.15s;
  font-family: 'Inter', sans-serif;
}
.nav-btn.active { color: var(--gold); }
.nav-icon { font-size: 20px; line-height:1; }
.nav-label { font-size: 9px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
</style>
</head>

// ============ STATE ============
let currentStage = 'group';
let currentView = 'schedule';
let notifEnabled = false;
let notifPerMatch = JSON.parse(localStorage.getItem('wc_notifs') || '{}');
let deferredPrompt = null;
let swReg = null;
let notifTimers = {};

// ============ INIT ============
window.addEventListener('DOMContentLoaded', () => {
  updateTZDisplay();
  registerSW();
  checkNotifStatus();
  render();
  checkInstallPrompt();
  // Reschedule any saved notifications
  rescheduleNotifications();
});

// ============ SERVICE WORKER ============
async function registerSW() {
  if ('serviceWorker' in navigator) {
    try {
      swReg = await navigator.serviceWorker.register('./sw.js');
    } catch(e) { console.log('SW failed:', e); }
  }
}

// ============ INSTALL ============
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});

function checkInstallPrompt() {
  if (window.matchMedia('(display-mode: standalone)').matches) {
    document.getElementById('install-banner').classList.remove('show');
  }
}

async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
  if (result.outcome === 'accepted') showToast('✅ App installed!');
}

function dismissInstall() {
  document.getElementById('install-banner').classList.remove('show');
}

// ============ NOTIFICATIONS ============
function checkNotifStatus() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    notifEnabled = true;
    document.getElementById('bell-btn').classList.add('active');
    document.getElementById('notif-banner').classList.remove('show');
  } else if (Notification.permission === 'default') {
    document.getElementById('notif-banner').classList.add('show');
  }
}

async function enableNotifications() {
  if (!('Notification' in window)) { showToast('❌ Notifications not supported'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    notifEnabled = true;
    document.getElementById('bell-btn').classList.add('active');
    document.getElementById('notif-banner').classList.remove('show');
    showToast('🔔 Notifications enabled!');
    rescheduleNotifications();
    render();
  } else {
    showToast('❌ Permission denied');
  }
}

async function toggleAllNotifications() {
  if (!notifEnabled) {
    await enableNotifications();
    return;
  }
  // Enable all upcoming matches
  const now = new Date();
  let count = 0;
  MATCHES.forEach(m => {
    const kickoff = new Date(m.utc);
    const notifTime = new Date(kickoff - 30 * 60000);
    if (notifTime > now && !notifPerMatch[m.id]) {
      notifPerMatch[m.id] = true;
      count++;
    }
  });
  saveNotifPrefs();
  rescheduleNotifications();
  showToast(`🔔 ${count} reminders scheduled!`);
  render();
}

function toggleMatchNotif(id) {
  if (!notifEnabled) {
    enableNotifications();
    return;
  }
  notifPerMatch[id] = !notifPerMatch[id];
  saveNotifPrefs();
  if (notifPerMatch[id]) {
    scheduleNotif(MATCHES.find(m => m.id === id));
    showToast('🔔 Reminder set!');
  } else {
    cancelNotif(id);
    showToast('🔕 Reminder removed');
  }
  render();
}

function saveNotifPrefs() {
  localStorage.setItem('wc_notifs', JSON.stringify(notifPerMatch));
}

function scheduleNotif(match) {
  if (!match) return;
  const kickoff = new Date(match.utc);
  const notifTime = new Date(kickoff - 30 * 60000);
  const now = new Date();
  const delay = notifTime - now;
  if (delay <= 0) return; // Already past

  cancelNotif(match.id);
  notifTimers[match.id] = setTimeout(() => {
    const homeFlag = FLAGS[match.home] || '';
    const awayFlag = FLAGS[match.away] || '';
    const title = `⚽ Kick-off in 30 mins!`;
    const body = `${homeFlag} ${match.home} vs ${match.away} ${awayFlag}\n📍 ${match.venue}`;
    if (swReg) {
      swReg.showNotification(title, {
        body,
        icon: './icons/icon-192.png',
        badge: './icons/icon-96.png',
        vibrate: [200, 100, 200],
        tag: `match-${match.id}`,
        requireInteraction: false
      });
    } else if (Notification.permission === 'granted') {
      new Notification(title, { body, icon: './icons/icon-192.png' });
    }
  }, delay);
}

function cancelNotif(id) {
  if (notifTimers[id]) {
    clearTimeout(notifTimers[id]);
    delete notifTimers[id];
  }
}

function rescheduleNotifications() {
  if (!notifEnabled) return;
  MATCHES.forEach(m => {
    if (notifPerMatch[m.id]) scheduleNotif(m);
  });
}

// ============ UI HELPERS ============
function updateTZDisplay() {
  const now = new Date();
  const tzName = now.toLocaleDateString('en-US',{timeZoneName:'short'}).split(', ')[1] || 'Local';
  document.getElementById('tz-display').textContent = tzName;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setStage(stage) {
  currentStage = stage;
  document.querySelectorAll('#stage-tabs .tab').forEach((t,i) => {
    t.classList.toggle('active', ['group','r32','r16','qf','sf','final'][i] === stage);
  });
  render();
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+view).classList.add('active');
  document.getElementById('stage-tabs').style.display = view==='schedule' ? 'flex' : 'none';
  render();
}

// ============ TIME ============
function formatTime(utc) {
  return new Date(utc).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function isToday(utc) {
  const d = new Date(utc), n = new Date();
  return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}

function isLive(utc) {
  const diff = (new Date() - new Date(utc)) / 60000;
  return diff >= 0 && diff < 105;
}

function isDone(utc) {
  return (new Date() - new Date(utc)) / 60000 > 105;
}

function groupLabel(g) {
  const m = {'R32':'Round of 32','R16':'Round of 16','QF':'Quarterfinal','SF':'Semifinal','Final':'Final','3rd':'3rd Place'};
  return m[g] ? m[g] : 'Group '+g;
}

// ============ RENDER ============
function matchCard(m) {
  const live = isLive(m.utc);
  const done = isDone(m.utc);
  const knockout = ['r32','r16','qf','sf','final'].includes(m.stage);
  const hasNotif = notifPerMatch[m.id];
  const canNotif = notifEnabled && !done && !live;

  const statusBadge = live
    ? `<span class="live-badge">LIVE</span>`
    : `<span class="match-time">${formatTime(m.utc)}</span>`;

  const scorePart = done && m.score
    ? `<div class="score-block"><span class="score-num">${m.score.split('-')[0]}</span><span class="score-sep">-</span><span class="score-num">${m.score.split('-')[1]}</span></div>`
    : `<div class="vs-text">VS</div>`;

  const notifBtn = canNotif
    ? `<button class="notif-toggle ${hasNotif?'on':''}" onclick="toggleMatchNotif(${m.id})">${hasNotif?'🔔':'🔕'}</button>`
    : '';

  return `<div class="match-card ${live?'is-live':''} ${done&&!live?'is-done':''}">
    ${notifBtn}
    <div class="match-top">
      <div class="match-meta">
        <span class="group-badge ${knockout?'knockout':''}">${groupLabel(m.group)}</span>
        <span class="venue-text">📍 ${m.venue}</span>
      </div>
      ${statusBadge}
    </div>
    <div class="teams-row">
      <div class="team">
        <span class="flag">${FLAGS[m.home]||'🏳️'}</span>
        <span class="team-name">${m.home}</span>
      </div>
      <div class="vs-block">${scorePart}</div>
      <div class="team right">
        <span class="team-name">${m.away}</span>
        <span class="flag">${FLAGS[m.away]||'🏳️'}</span>
      </div>
    </div>
  </div>`;
}

function render() {
  const main = document.getElementById('main-content');

  if (currentView === 'groups') {
    main.innerHTML = Object.entries(GROUPS).map(([g, teams]) =>
      `<div class="group-card">
        <div class="group-title">⚽ GROUP ${g}</div>
        ${teams.map((t,i) => `<div class="group-team"><span class="team-rank">${i+1}</span><span>${FLAGS[t]||'🏳️'}</span><span>${t}</span></div>`).join('')}
      </div>`
    ).join('');
    return;
  }

  if (currentView === 'today') {
    const todayMatches = MATCHES.filter(m => isToday(m.utc));
    main.innerHTML = todayMatches.length
      ? todayMatches.map(matchCard).join('')
      : `<div class="empty"><div class="empty-icon">⚽</div>No matches today.<br>Check the schedule!</div>`;
    return;
  }

  // Schedule
  const filtered = MATCHES.filter(m => m.stage === currentStage);
  const byDate = {};
  filtered.forEach(m => {
    const key = new Date(m.utc).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    if (!byDate[key]) byDate[key] = {utc:m.utc, matches:[]};
    byDate[key].matches.push(m);
  });

  let html = Object.entries(byDate).map(([date, data]) => {
    const today = isToday(data.utc);
    return `<div class="date-group">
      <div class="date-label">${today?'<span class="date-today">TODAY</span>':''}${date}</div>
      ${data.matches.map(matchCard).join('')}
    </div>`;
  }).join('');

  main.innerHTML = html || `<div class="empty"><div class="empty-icon">🏟️</div>Matchups TBD after group stage</div>`;
}
</script>
